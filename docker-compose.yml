
services:
  reports:
    build:
      context: ../SistemaDeclaraciones_reportes
      args:
        - NODE_ENV=${NODE_ENV}
    ports:
      - 3001:3001
    restart: unless-stopped

  app:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV}
    restart: unless-stopped
    depends_on:
      - reports
    volumes:
      - .:/usr/app
    ports:
      - 3000:3000
    networks:
      - default
      - s1-net

networks:
  s1-net:
    external: true